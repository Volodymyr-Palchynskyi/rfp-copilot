name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Python version comes from backend/.python-version; --frozen refuses to touch uv.lock.
      - run: uv sync --frozen
      # No API key here on purpose: every test uses fakes, and the data checks are offline.
      - run: uv run pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      # The production build also type-checks every template and prerenders the app.
      - run: npx ng build --configuration production

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (no API key, no .env)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Frontend is served
        run: curl -fsS http://localhost:8081/ | grep -q "<app-root"
      - name: API is reachable through the nginx proxy and refuses admin calls when no token is set
        run: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/v1/knowledge/ingest)" = "403"
      - name: Missing API key degrades to 503, not a crash
        run: test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8081/api/v1/knowledge/search?q=fleet+tracking')" = "503"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
