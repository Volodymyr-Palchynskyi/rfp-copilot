[project]
name = "backend"
version = "0.1.0"
description = "RFP Proposal Copilot Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
